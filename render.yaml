services:
  - type: web
    name: energy-supply-chain-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173
